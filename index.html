<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>코드위키 — 시각적으로 배우는 SAP 위키</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-symbol.svg" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 로그인 후 전체 레이아웃: 좌측 고정 일체형 사이드바 + 우측 워크스페이스 -->
  <div class="app-layout" id="appLayout">
    <!-- 1. 좌측 고정 사이드바 (Quest-On 스타일 도킹 바) -->
    <aside class="docked-sidebar" id="dockedSidebar">
      <!-- 상단 브랜드 로고 & 경계선 접기(<) 원형 버튼 -->
      <div class="sidebar-top-brand">
        <a href="#doc/welcome-guide" class="brand-logo" id="brandHomeLink">
          <span class="brand-symbol" aria-label="코드위키 심볼">
            <svg width="20" height="20" viewBox="0 0 120 120" fill="currentColor">
              <path d="M12 12 H54 V54 H41 V40 H15 V28.5 H41 V23.5 H12 Z" />
              <path d="M66 12 H108 V25 H79 V41 H108 V54 H66 Z" />
              <path fill-rule="evenodd" clip-rule="evenodd" d="M33 66 A21 21 0 1 0 33 108 A21 21 0 1 0 33 66 Z M33 79 A8 8 0 1 1 33 95 A8 8 0 1 1 33 79 Z" />
              <path d="M66 66 H108 V108 H95 V94 H69 V82.5 H95 V77.5 H66 Z" />
            </svg>
          </span>
          <span class="brand-name">코드위키</span>
        </a>
        <button id="sidebarCollapseBtn" class="edge-collapse-btn" title="사이드바 접기" aria-label="사이드바 접기">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- 중앙 스크롤 메뉴 영역 -->
      <div class="sidebar-scroll-body">
        <!-- MAIN 섹션 -->
        <div class="sb-group">
          <div class="sb-group-label">MAIN</div>
          <a href="#doc/welcome-guide" class="sb-menu-item" id="sbHomeItem" data-doc="welcome-guide">
            <svg class="sb-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
            <span>프레임워크 홈</span>
          </a>
          <button type="button" id="openBoardBtn" class="sb-menu-item">
            <svg class="sb-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>수정·추가 건의 게시판</span>
            <span id="boardOpenCountBadge" class="pending-badge hidden" style="margin-left:auto;">0</span>
          </button>
          <!-- 관리자일 때만 노출되는 [학생 승인 관리] 슬롯 -->
          <div id="adminSidebarSlot"></div>
        </div>

        <!-- CHAPTERS (진도 및 카테고리 폴더) 섹션 -->
        <div class="sb-group">
          <div class="sb-group-header-row">
            <span class="sb-group-label">CHAPTERS</span>
            <span id="totalDocCount" class="sb-progress-text">0/0 완료</span>
          </div>
          <nav id="categoryNav" class="category-folder-nav"></nav>
        </div>

        <!-- T-CODE 빠른 사전 섹션 -->
        <div class="sb-group">
          <div class="sb-group-label">T-CODES</div>
          <div id="tcodeList" class="tcode-list"></div>
        </div>
      </div>

      <!-- 하단 고정 유저 프로필 카드 (Quest-On 하단 프로필 스타일) -->
      <div class="sidebar-bottom-profile" id="sidebarProfileSlot"></div>
    </aside>

    <!-- 2. 우측 메인 워크스페이스 영역 -->
    <div class="workspace-area" id="workspaceArea">
      <!-- 상단 유틸리티 헤더 (검색창 & 학습 모드 컨트롤) -->
      <header class="workspace-topbar">
        <div class="ws-topbar-left">
          <button id="sidebarExpandBtn" class="icon-btn hidden" title="사이드바 펼치기" aria-label="사이드바 펼치기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="4" y1="7" x2="20" y2="7"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="17" x2="14" y2="17"></line>
            </svg>
          </button>

          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="20" y1="20" x2="16" y2="16"></line>
            </svg>
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="개념, T-Code, 키워드 검색 ( / 키)"
              autocomplete="off"
            />
            <kbd class="search-kbd">/</kbd>
            <div id="searchDropdown" class="search-dropdown hidden"></div>
          </div>
        </div>

        <div class="ws-topbar-right">
          <button id="quizModeBtn" class="toss-chip-btn" title="핵심 키워드를 가려서 스스로 테스트하는 복습 모드">
            <span class="chip-dot"></span>
            <span>암기 모드 OFF</span>
          </button>
          <button id="humorModeBtn" class="toss-chip-btn active" title="나무위키식 취소선 사족/메모 표시 토글">
            <span>취소선 메모 ON</span>
          </button>
          <button id="themeToggleBtn" class="icon-btn" title="라이트/다크 모드 전환" aria-label="테마 전환">
            <span id="themeIcon">🌙</span>
          </button>
        </div>
      </header>

      <!-- 본문 + 우측 목차 그리드 -->
      <div class="app-shell" id="appShell">
        <main class="main-content">
          <!-- 나무위키 스타일 둘러보기 틀 -->
          <section class="toss-card navbox-card" id="navboxCard">
            <div class="navbox-header" id="navboxToggle">
              <div class="navbox-title-wrap">
                <span class="toss-badge-blue">둘러보기 틀</span>
                <strong class="navbox-title">코드위키 전체 학습 개념 한눈에 보기</strong>
              </div>
              <button class="navbox-fold-btn" id="navboxFoldBtn">접기 ▲</button>
            </div>
            <div class="navbox-body" id="navboxBody"></div>
          </section>

          <!-- 문서 본문 렌더링 영역 -->
          <article class="toss-card article-card" id="articleContainer"></article>
        </main>

        <!-- 우측 목차(TOC) + 핵심 요약 + 역링크 -->
        <aside class="sidebar-right">
          <div class="toss-card right-card">
            <div class="card-section-header">
              <span class="section-label">문서 목차</span>
            </div>
            <nav id="tocList" class="toc-list"></nav>
          </div>

          <div class="toss-card right-card" id="metaCardWrap">
            <div class="card-section-header">
              <span class="section-label">핵심 요약 카드</span>
            </div>
            <div id="summarySpecBox" class="summary-spec-box"></div>
          </div>

          <div class="toss-card right-card">
            <div class="card-section-header">
              <span class="section-label">연결된 문서 (역링크)</span>
            </div>
            <div id="backlinkBox" class="backlink-box"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- 링크 마우스 오버 시 뜨는 미니 프리뷰 툴팁 -->
  <div id="hoverPreviewCard" class="hover-preview-card hidden" role="tooltip"></div>

  <!-- 로그인 전 미니멀 심볼 + Auth 랜딩페이지 -->
  <div id="authGateOverlay" class="auth-gate-overlay hidden"></div>

  <!-- 관리자 전용 [우리 반 학생 승인 관리] 모달 -->
  <div id="adminModal" class="admin-modal-backdrop hidden"></div>

  <!-- 수정·업데이트 건의글 작성 모달 -->
  <div id="boardWriteModal" class="admin-modal-backdrop hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/visualizers.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
